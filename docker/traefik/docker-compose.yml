services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      # 📦 Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # 🚪 Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # 🔁 Redirect HTTP → HTTPS otomatis
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # 🔒 Let's Encrypt (SSL)
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@sukabumikota.go.id"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

      # 🧰 Dashboard (optional)
      - "--api.dashboard=false"
      - "--api.insecure=false" # ❗ Hanya aktifkan untuk debug, matikan di production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 🔄 Traefik needs to read docker metadata
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/letsencrypt/acme.json
    networks:
      - shared_net

networks:
  shared_net:
    external: true
